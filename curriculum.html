<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLIGHT TERMINAL – Boumerdès → Blois</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--g:#35ff70;--g2:#1aa83f;--g3:#0a4a1c;--glow:0 0 6px rgba(53,255,112,.7);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--g);font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;font-size:20px}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.28;z-index:0}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:14px}
h1{margin:0 0 10px;font-weight:400;font-size:30px;letter-spacing:2px;text-shadow:var(--glow)}
h1 small{color:var(--g2);font-size:18px;margin-left:8px}
.grid{display:grid;grid-template-columns:1fr 290px;gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{border:2px solid var(--g2);background:rgba(0,10,3,.88);box-shadow:0 0 14px rgba(53,255,112,.25),inset 0 0 20px rgba(53,255,112,.06);padding:10px}
.map{position:relative;aspect-ratio:240/200;padding:0;overflow:hidden}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
#cv{image-rendering:pixelated;image-rendering:crisp-edges}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 2px 3px),radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
h2{margin:0 0 6px;font-weight:400;font-size:22px;border-bottom:1px dashed var(--g2);padding-bottom:4px}
ol{list-style:none;margin:0 0 10px;padding:0}
li{display:flex;gap:8px;padding:2px 0;color:var(--g3);filter:brightness(1.9)}
li .m{width:18px;text-align:center}
li .km{margin-left:auto;color:var(--g2)}
li.done{color:var(--g2);filter:none}
li.cur{color:var(--g);filter:none;text-shadow:var(--glow);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.55}}
.hud div{display:flex;justify-content:space-between}
.bar{height:16px;margin:6px 0 10px;border:2px solid var(--g2);padding:2px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--g) 0 6px,transparent 6px 8px)}
#log{height:112px;overflow:hidden;color:var(--g2);font-size:18px;line-height:1.1}
.cur-blink::after{content:"█";animation:bl 1s steps(2) infinite}
#tl{margin-top:14px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(104px,1fr);overflow-x:auto;padding:6px 0}
.n{text-align:center;position:relative;color:var(--g3);filter:brightness(1.9);padding-top:16px}
.n::before{content:"";position:absolute;top:5px;left:0;right:0;border-top:2px dotted currentColor}
.n::after{content:"";position:absolute;top:0;left:50%;margin-left:-5px;width:10px;height:10px;background:currentColor}
.n:first-child::before{left:50%}.n:last-child::before{right:50%}
.n b{display:block;font-weight:400;font-size:20px;line-height:24px;white-space:nowrap}
.n i{display:block;font-style:normal;font-size:20px;line-height:24px;white-space:nowrap}
.n.lv::after{transform:rotate(45deg)}
.n.on{color:var(--g2);filter:none}
.n.now{color:var(--g);text-shadow:var(--glow)}
.n.now::after{animation:bl 1s steps(2) infinite}
#flash{position:absolute;inset:0;background:#35ff70;opacity:0;pointer-events:none;z-index:3}
#flash.show{animation:fl .6s steps(6)}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
#lvl{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);opacity:0;text-align:center;pointer-events:none;z-index:4;background:rgba(0,0,0,.85);border:3px double var(--g);padding:8px 22px;text-shadow:var(--glow);white-space:nowrap}
#lvl .a{font-size:38px;letter-spacing:4px;color:#d8ffe2}
#lvl .b{font-size:26px}
#lvl.show{animation:lvl 2.6s steps(26) forwards}
@keyframes lvl{0%{transform:translate(-50%,-10%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">
  <h1>&gt; FLIGHT TERMINAL<small>BRU › BMD › TLS › RNS › ROM › RNS › PAR › BLO</small></h1>
  <div class="grid">
    <div class="panel map"><canvas id="cv" width="240" height="200"></canvas><canvas id="ov"></canvas><div id="flash"></div><div id="lvl"><div class="a" id="lva"></div><div class="b" id="lvb"></div></div></div>
    <div>
      <div class="panel">
        <h2>ITINERARY</h2>
        <ol id="it"></ol>
        <h2>TELEMETRY</h2>
        <div class="hud">
          <div><span>LAT</span><span id="lat"></span></div>
          <div><span>LON</span><span id="lon"></span></div>
          <div><span>HEADING</span><span id="hdg"></span></div>
          <div><span>YEAR</span><span id="yr"></span></div>
          <div><span>LEVEL</span><span id="lvv"></span></div>
          <div><span>FLOWN</span><span id="fl"></span></div>
        </div>
        <div class="bar" id="bar"><i></i></div>
        <h2>LOG</h2>
        <div id="log"></div>
      </div>
    </div>
  </div>
<div class="panel" id="tl"></div>
</div>
<script>
(function(){
var W=240,H=200;
var stops=[["BRUSSELS",4.35,50.85,1988],["BOUMERDÈS",3.47,36.76,1991],["TOULOUSE",1.44,43.60,2013],["RENNES",-1.68,48.11,2014],["ROME",12.50,41.90,2016],["RENNES",-1.68,48.11,2017],["PARIS",2.35,48.86,2018],["BLOIS",1.33,47.59,2026]];
function P(lon,lat){return [(lon+10)/26*W,(52-lat)/19*H];}
var land=[
[[-5.6,36],[-9,37],[-9.5,38.7],[-8.8,41],[-9.3,43],[-8,43.7],[-4,43.4],[-1.8,43.4],[-1.2,46],[-2.2,47.3],[-4.5,47.9],[-4.7,48.5],[-2.5,48.7],[-1.5,48.7],[-1.5,49.7],[0.2,49.4],[1.6,50.9],[3.5,51.4],[5,53],[17,55],[17,46],[13.7,45.6],[12.3,45.3],[12.3,44.2],[13.6,43.5],[14.2,42.4],[17,41.5],[17,38.9],[16.5,38.9],[16,37.9],[15.7,38],[15.6,40],[14.8,40.2],[14,41],[13,41.3],[12,42],[11,42.4],[10.5,43],[10.2,44],[8.8,44.4],[7.5,43.8],[6,43.1],[4.5,43.4],[3.2,43],[3.2,42.4],[0.8,41],[-0.3,39.5],[0,38.7],[-0.8,37.6],[-2,36.8],[-4.4,36.7]],
[[-10,30],[-10,33.5],[-6.8,34.2],[-6,35.8],[-5.3,35.8],[-3,35.3],[-1,35.1],[0,35.9],[2,36.6],[3,36.8],[3.9,36.9],[5,36.9],[7,37],[9,37.3],[10.2,37.2],[10.6,36.8],[11,37],[10.5,36],[11,35],[10.2,34.3],[11,33.2],[13,32.9],[17,32.6],[17,30]],
[[12.5,38],[15.6,38.3],[15.1,36.7],[12.5,37.6]],
[[8.2,41],[9.7,41],[9.6,39.2],[8.5,39]],
[[8.6,42.6],[9.4,43],[9.5,41.4],[8.8,41.6]],
[[2.4,39.6],[3.4,39.9],[3.2,39.3],[2.6,39.3]],
[[-5.5,50],[1.4,51.1],[1.7,52.7],[1.7,53],[-5,53],[-5,51.7]]
];
var t=document.createElement('canvas');t.width=W;t.height=H;var tc=t.getContext('2d');
tc.fillStyle='#fff';
land.forEach(function(poly){tc.beginPath();poly.forEach(function(p,i){var q=P(p[0],p[1]);i?tc.lineTo(q[0],q[1]):tc.moveTo(q[0],q[1]);});tc.closePath();tc.fill();});
var d=tc.getImageData(0,0,W,H).data,mask=new Uint8Array(W*H);
for(var i=0;i<W*H;i++)mask[i]=d[i*4+3]>110?1:0;
var base=document.createElement('canvas');base.width=W;base.height=H;var bc=base.getContext('2d');
var img=bc.createImageData(W,H);
function m(x,y){return x<0||y<0||x>=W||y>=H?1:mask[y*W+x];}
for(var y=0;y<H;y++)for(var x=0;x<W;x++){
  var c,i2=(y*W+x)*4;
  if(mask[y*W+x]){
    var edge=!m(x-1,y)||!m(x+1,y)||!m(x,y-1)||!m(x,y+1);
    c=edge?[44,255,106]:((x+y)%2?[4,28,10]:[7,40,15]);
  }else{c=(x%12==0&&y%12==0)?[10,70,28]:[0,6,2];}
  img.data[i2]=c[0];img.data[i2+1]=c[1];img.data[i2+2]=c[2];img.data[i2+3]=255;
}
bc.putImageData(img,0,0);

var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var ov=document.getElementById('ov'),oc=ov.getContext('2d'),sc=1,dpr=window.devicePixelRatio||1;
function fit(){var r=cv.getBoundingClientRect();ov.width=r.width*dpr;ov.height=r.height*dpr;sc=ov.width/W;}
window.addEventListener('resize',fit);fit();

var pts=stops.map(function(s){return P(s[1],s[2]);});
function hav(a,b){var R=6371,r=Math.PI/180,dl=(b[1]-a[1])*r,dn=(b[2]-a[2])*r;
  var h=Math.sin(dn/2)*Math.sin(dn/2)+Math.cos(a[2]*r)*Math.cos(b[2]*r)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.sqrt(h));}
var legKm=[],total=0;
for(var i=0;i<stops.length-1;i++){legKm[i]=hav(stops[i],stops[i+1]);total+=legKm[i];}
var it=document.getElementById('it'),lis=[];
stops.forEach(function(s,i){var li=document.createElement('li');
  li.innerHTML='<span class="m"></span><span>'+(i+1)+'. '+s[3]+' '+s[0]+'</span><span class="km">'+(i?Math.round(legKm[i-1])+' km':'START')+'</span>';
  it.appendChild(li);lis.push(li);});
var logEl=document.getElementById('log'),logs=[];
function log(s){logs.push('&gt; '+s);if(logs.length>6)logs.shift();logEl.innerHTML=logs.join('<br>')+'<span class="cur-blink"></span>';}

var YEARS=stops.map(function(s){return s[3];}),LVY=[2013,2014,2019];
var leg=0,phase='spawn',tm=0,flown=0,last=performance.now(),dirty=true,dur=1,level=1,lvDone={},year=1988,lastY=0,ee=0,parts=[],trail=[],rings=[],hdg=0,prog=0,pos=pts[0].slice();
function legDur(i){return i===stops.length-2?3.6:Math.max(1.8,legKm[i]/320);}
function dwellT(i){return (i===2||i===3)?2.6:(i===stops.length-1?2.8:1.3);}
var lvl=document.getElementById('lvl'),flash=document.getElementById('flash');
function banner(a,b){document.getElementById('lva').textContent=a;document.getElementById('lvb').textContent=b;lvl.classList.remove('show');flash.classList.remove('show');void lvl.offsetWidth;lvl.classList.add('show');flash.classList.add('show');}
function burst(x,y){for(var i=0;i<70;i++){var a=Math.random()*6.283,sp=15+Math.random()*55;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-10,l:1+Math.random()*.6,c:i%3});}rings.push({x:x,y:y,t:0});}
function announce(){
  if(phase==='spawn'){log('SPAWN 1988 · BRUSSELS');banner('PLAYER 1 READY','1988 · BRUSSELS');rings.push({x:pts[0][0],y:pts[0][1],t:0});}
  else if(phase==='dwell'){log('LANDED '+stops[leg][0]+' · '+stops[leg][3]);rings.push({x:pts[leg][0],y:pts[leg][1],t:0});}
  else{dur=legDur(leg);log('DEPART '+stops[leg][0]+' → '+stops[leg+1][0]);}
  dirty=true;
}
// timeline
var TLI=[],tl=document.getElementById('tl'),h='<h2>TIMELINE</h2><div class="rail">';
stops.forEach(function(s,i){TLI.push([s[3],s[0]]);if(s[3]===2018)TLI.push([2019,'LEVEL UP']);});
TLI.forEach(function(x){h+='<div class="n'+(LVY.indexOf(x[0])>=0?' lv':'')+'"><b>'+x[0]+'</b><i>'+x[1]+'</i></div>';});
tl.innerHTML=h+'</div>';
var tn=tl.querySelectorAll('.n');
function updTL(){tn.forEach(function(n,i){var on=year>=TLI[i][0],nx=i+1<TLI.length&&year>=TLI[i+1][0];n.className='n'+(LVY.indexOf(TLI[i][0])>=0?' lv':'')+(on?' on':'')+(on&&!nx?' now':'');});}
announce();

var spr=['......W......','.....WWW.....','.....WGW.....','....GWWWG....','...GGWWWGG...','..GGGWWWGGG..','.GGGGWWWGGGG.','GGGGDWWWDGGGG','.....WWW.....','.....WWW.....','....GWWWG....','...GGWWWGG...','....GGWGG....'];
var pal={W:'#ffffff',G:'#e6e6e6',D:'#a8a8a8'};
function rnd(x,y,f){var q=Math.sin(x*12.9898+y*78.233+f*37.719)*43758.5453;return q-Math.floor(q);}
function plane(px,py,a,keep,f){
  var ca=Math.cos(-a),sa=Math.sin(-a);px=Math.round(px);py=Math.round(py);
  for(var pass=0;pass<2;pass++)for(var y=-9;y<=9;y++)for(var x=-9;x<=9;x++){
    var sx=Math.round((ca*x-sa*y)*1.25)+6,sy=Math.round((sa*x+ca*y)*1.25)+6;
    if(sx<0||sx>12||sy<0||sy>12)continue;var ch=spr[sy][sx];if(ch==='.')continue;
    if(keep<1&&rnd(x,y,f)>keep)continue;
    if(pass===0){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(px+x+2,py+y+3,1,1);}
    else{ctx.fillStyle=pal[ch];ctx.fillRect(px+x,py+y,1,1);}
  }
}
function line(a,b,col,sz){
  var dx=b[0]-a[0],dy=b[1]-a[1],L=Math.max(1,Math.ceil(Math.hypot(dx,dy)));ctx.fillStyle=col;
  for(var i=0;i<=L;i+=4){var k=i/L;ctx.fillRect(Math.round(a[0]+dx*k),Math.round(a[1]+dy*k),sz,sz);}
}
function headTo(i){return i<stops.length-1?Math.atan2(pts[i+1][0]-pts[i][0],-(pts[i+1][1]-pts[i][1])):hdg;}
var labels=[["1 BRUSSELS",0,0,-0.4,'l'],["2 BOUMERDÈS",1,0,0.9,'l'],["3 TOULOUSE",2,0,0.2,'l'],["4/6 RENNES",3,0,0,'r'],["5 ROME",4,0,0.3,'l'],["7 PARIS",6,0,-0.5,'l'],["8 BLOIS",7,0,1.1,'l']];
var PC=['#d8ffe2','#35ff70','#ffe36a'];

function frame(now){
  var dt=Math.min(0.1,(now-last)/1000);last=now;tm+=dt;
  var f=Math.floor(now/80);
  if(phase==='spawn'){pos=pts[0].slice();if(tm>2.6){phase='fly';tm=0;announce();}}
  else if(phase==='dwell'){
    pos=pts[leg].slice();
    if(tm>dwellT(leg)){
      if(leg===stops.length-1){leg=0;flown=0;level=1;lvDone={};phase='spawn';tm=0;trail=[];announce();}
      else{phase='fly';tm=0;announce();}
    }
  }else{
    prog=Math.min(1,tm/dur);ee=prog<.5?2*prog*prog:1-Math.pow(-2*prog+2,2)/2;
    var a=pts[leg],b=pts[leg+1];
    pos=[a[0]+(b[0]-a[0])*ee,a[1]+(b[1]-a[1])*ee];
    hdg=headTo(leg);trail.push(pos.slice());if(trail.length>18)trail.shift();
    if(prog>=1){flown+=legKm[leg];leg++;phase='dwell';tm=0;announce();}
  }
  if(phase!=='fly'&&trail.length)trail.shift();
  year=phase==='fly'?Math.floor(YEARS[leg]+(YEARS[leg+1]-YEARS[leg])*ee):YEARS[leg];
  LVY.forEach(function(Y){if(!lvDone[Y]&&year>=Y){lvDone[Y]=1;level++;burst(pos[0],pos[1]);var T={2013:'STATE ENGINEER',2014:'MASTER OF SCIENCE',2019:'DOCTOR OF PHILOSOPHY'}[Y];banner('★ LEVEL UP ★',T);log('LEVEL UP → '+T+' ('+Y+')');}});
  if(year!==lastY){lastY=year;updTL();}

  ctx.drawImage(base,0,0);
  for(var i=0;i<pts.length-1;i++){
    if(i<leg)line(pts[i],pts[i+1],'#35ff70',2);
    else if(i===leg&&phase==='fly'){line(pts[i],pts[i+1],'#0f7a2c',1);line(pts[i],pos,'#35ff70',2);}
    else line(pts[i],pts[i+1],'#0f7a2c',1);
  }
  var bl=Math.floor(now/350)%2;
  pts.forEach(function(p,i){
    var cur=(phase!=='fly'&&i===leg)||(phase==='fly'&&i===leg+1);
    ctx.fillStyle=cur&&bl?'#d8ffe2':'#35ff70';
    ctx.fillRect(Math.round(p[0])-1,Math.round(p[1])-1,3,3);
  });
  rings=rings.filter(function(r){r.t+=dt;return r.t<1.2;});
  rings.forEach(function(r){var rad=r.t*55;ctx.fillStyle='#35ff70';ctx.globalAlpha=1-r.t/1.2;
    for(var k=0;k<72;k++){var an=k/72*6.283;ctx.fillRect(Math.round(r.x+Math.cos(an)*rad),Math.round(r.y+Math.sin(an)*rad*.9),1,1);}ctx.globalAlpha=1;});
  if(phase==='spawn'&&tm<2.2){
    ctx.fillStyle='#35ff70';ctx.globalAlpha=.6;var k2=tm/2.2;
    for(var y=0;y<pos[1];y++)if(rnd(pos[0],y,f)<.55*(1-k2)+.1)ctx.fillRect(Math.round(pos[0])-1,y,3,1);
    ctx.globalAlpha=1;
  }
  trail.forEach(function(t,i){ctx.globalAlpha=i/trail.length*.8;ctx.fillStyle='#35ff70';ctx.fillRect(Math.round(t[0]),Math.round(t[1]),1,1);});
  ctx.globalAlpha=1;
  plane(pos[0],pos[1],phase==='fly'?hdg:headTo(leg),phase==='spawn'?Math.min(1,tm/2):1,f);
  parts=parts.filter(function(p){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;return p.l>0;});
  parts.forEach(function(p){ctx.fillStyle=PC[p.c];ctx.fillRect(Math.round(p.x),Math.round(p.y),p.c?1:2,p.c?1:2);});

  oc.clearRect(0,0,ov.width,ov.height);
  oc.font=(17*dpr)+'px VT323, monospace';oc.shadowColor='#35ff70';oc.shadowBlur=6*dpr;oc.fillStyle='#35ff70';
  labels.forEach(function(L){
    var p=pts[L[1]],x=p[0]*sc,y=p[1]*sc;
    oc.textAlign=L[4]==='r'?'right':'left';
    oc.fillText(L[0],x+(L[4]==='r'?-9:9)*dpr,y+(L[3]*14+5)*dpr);
  });
  oc.textAlign='left';oc.fillStyle='#d8ffe2';oc.fillText(String(year),(pos[0]+10)*sc,(pos[1]-9)*sc);
  oc.shadowBlur=0;oc.fillStyle='#0f7a2c';
  oc.fillText('MEDITERRANEAN',W*0.57*sc,H*0.76*sc);oc.fillText('ATLANTIC',6*sc,H*0.4*sc);oc.fillText('N. AFRICA',W*0.3*sc,H*0.97*sc);

  if(dirty){lis.forEach(function(li,i){
    var cl,cur=(phase!=='fly'&&i===leg)||(phase==='fly'&&i===leg+1);
    if(cur)cl='cur';else if(i<=leg)cl='done';else cl='';
    li.className=cl;li.firstChild.textContent=cl==='cur'?'►':(cl==='done'?'✓':'·');
  });dirty=false;}
  var lon=-10+pos[0]/W*26,lat=52-pos[1]/H*19;
  var cu=flown+(phase==='fly'?legKm[leg]*prog:0);
  document.getElementById('lat').textContent=lat.toFixed(2)+'°N';
  document.getElementById('lon').textContent=Math.abs(lon).toFixed(2)+'°'+(lon<0?'W':'E');
  document.getElementById('hdg').textContent=phase==='fly'?String(Math.round((hdg*180/Math.PI+360)%360)).padStart(3,'0')+'°':'---';
  document.getElementById('yr').textContent=year;
  document.getElementById('lvv').textContent='LV.'+level;
  document.getElementById('fl').textContent=Math.round(cu)+' / '+Math.round(total)+' km';
  var n=cu/total*100;
  document.querySelector('#bar i').style.width=n+'%';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// matrix rain
var rc=document.getElementById('rain'),rx=rc.getContext('2d'),cols=[],fs=16;
function rs(){rc.width=innerWidth;rc.height=innerHeight;cols=[];for(var i=0;i<Math.ceil(rc.width/fs);i++)cols[i]=Math.random()*rc.height/fs;}
rs();addEventListener('resize',rs);
var chars='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄ0123456789ABCDEF';
setInterval(function(){
  rx.fillStyle='rgba(0,0,0,.12)';rx.fillRect(0,0,rc.width,rc.height);
  rx.fillStyle='#35ff70';rx.font=fs+'px monospace';
  cols.forEach(function(y,i){rx.fillText(chars[Math.floor(Math.random()*chars.length)],i*fs,y*fs);
    cols[i]=(y*fs>rc.height&&Math.random()>.975)?0:y+1;});
},60);
})();
</script>
</body>
</html>
