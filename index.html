<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karim Kecir</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #000;
      }

      .msdos-text {
        position: relative;
        z-index: 3;
        margin: 0;
        padding: 8px;
        color: #fff;
        font-family: "Perfect DOS VGA 437", "PxPlus IBM VGA8", "Fixedsys Excelsior 3.01", Fixedsys, monospace;
        font-size: 16px;
        font-weight: normal;
        line-height: 1;
        text-align: center;
        text-shadow: none;
      }

      @keyframes construct-walk-west {
        0%, 50% {
          opacity: 0;
          transform: translateX(calc(-100vw - 48px));
        }
        50.01% {
          opacity: 1;
          transform: translateX(0);
        }
        100% {
          opacity: 1;
          transform: translateX(calc(-100vw - 48px));
        }
      }

      @keyframes construct-walk-east {
        0% {
          opacity: 1;
          transform: translateX(calc(-100vw - 48px));
        }
        49.99% {
          opacity: 1;
          transform: translateX(0);
        }
        50%, 100% {
          opacity: 0;
          transform: translateX(0);
        }
      }

      @keyframes construct-steps {
        from { background-position: 0 0; }
        to { background-position: -288px 0; }
      }

      .construct-walker {
        position: fixed;
        right: -48px;
        bottom: 8px;
        width: 48px;
        height: 48px;
        animation-duration: 32s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        pointer-events: none;
        z-index: 2;
      }

      /* CSS frame playback avoids Safari's offscreen GIF suspension. */
      .construct-walker::before {
        content: "";
        display: block;
        width: 48px;
        height: 48px;
        background-repeat: no-repeat;
        background-size: 288px 48px;
        animation: construct-steps 1.2s steps(6) infinite;
      }

      .construct-walker--west::before {
        background-image: url("img/construct_w.png");
      }

      .construct-walker--east::before {
        background-image: url("img/construct_e.png");
      }

      .high-speed-train {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        height: 128px;
        background: url("img/high-speed-train.png") right bottom / cover no-repeat;
        filter: brightness(0.65) saturate(0.6);
        pointer-events: none;
        z-index: 0;
      }

      .construction-path {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        height: 128px;
        background: url("img/construction-site.png") right bottom / cover no-repeat;
        filter: brightness(0.65) saturate(0.6);
        pointer-events: none;
        z-index: 1;
      }

      .construct-walker--west { animation-name: construct-walk-west; }

      .construct-walker--east {
        animation-name: construct-walk-east;
      }
    </style>
  </head>

  <body>
    <p class="msdos-text">La semplicit&agrave; &egrave; l'ultima sofisticazione. &mdash; Clare Boothe Luce</p>
	<div class="high-speed-train" aria-hidden="true"></div>
	<div class="construction-path" aria-hidden="true"></div>
	<div class="construct-walker construct-walker--west" aria-hidden="true"></div>
	<div class="construct-walker construct-walker--east" aria-hidden="true"></div>

  </body>
	
</html>
