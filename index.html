<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030a05">
  <meta name="description" content="An animated flight path through Karim Kecir's education and career milestones.">
  <title>Karim Kecir · Flight Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500&family=Alegreya+Sans:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1><span id="dr">Dr. </span>Karim K<span class="sc">ecir</span></h1>
    <div class="sub">Curriculum flight path · 1988 – 2026</div>
  </header>
  <div class="grid">
    <div class="panel map">
      <canvas id="cv"></canvas>
      <button class="restart" id="restart" type="button" aria-label="Restart flight path" title="Restart animation">↻ Restart</button>
      <div id="flash"></div>
      <div id="lvl"><div class="a">LEVEL UP</div><div class="b" id="lvb"></div></div>
    </div>
    <div class="panel">
      <h2>Route</h2><ol id="it"></ol>
      <h2>Milestones</h2><ol id="ms"></ol>
      <h2>Telemetry</h2>
      <div class="row"><span>POSITION</span><span id="pos"></span></div>
      <div class="row"><span>YEAR</span><span id="yr"></span></div>
      <div class="row"><span>LEVEL</span><span id="lvv"></span></div>
      <div class="row"><span>FLOWN</span><span id="fl"></span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </div>
</div>
<footer class="site-footer">© <span id="copyright-year"></span> Karim Kecir</footer>
</body>
</html>
