<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030a05">
  <meta name="description" content="An animated curriculum journey through Karim Kecir's education and milestones.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Karim Kecir · Curriculum Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500&family=Alegreya+Sans:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1><span id="dr">Dr. </span>Karim K<span class="sc">ecir</span></h1>
    <div class="sub">Curriculum journey · 1988 – 2026</div>
  </header>
  <div class="grid">
    <div class="panel map">
      <canvas id="cv"></canvas>
      <button class="restart" id="restart" type="button" aria-label="Restart route animation" title="Restart animation">↻ Restart</button>
      <a id="algeriaLink" class="algeria-link" href="https://en.wikipedia.org/wiki/Algerian_Civil_War" target="_blank" rel="noopener noreferrer">Algerian Civil War (1992–2002) ↗</a>
      <a id="earthquakeLink" class="algeria-link" href="https://en.wikipedia.org/wiki/2003_Boumerd%C3%A8s_earthquake" target="_blank" rel="noopener noreferrer">2003 Boumerdès earthquake ↗</a>
      <a id="covidLink" class="algeria-link" href="https://en.wikipedia.org/wiki/COVID-19_pandemic" target="_blank" rel="noopener noreferrer">COVID-19 pandemic ↗</a>
      <div id="flash"></div>
      <div id="lvl"><span class="star" aria-hidden="true">✦</span><span class="b" id="lvb"></span></div>
    </div>
    <div class="panel">
      <h2>Route</h2><ol id="it"></ol>
      <h2>Milestones</h2><ol id="ms"></ol>
      <h2>Telemetry</h2>
      <div class="row"><span>POSITION</span><span id="pos"></span></div>
      <div class="row"><span>YEAR</span><span id="yr"></span></div>
      <div class="row"><span>LEVEL</span><span id="lvv"></span></div>
      <div class="row"><span>TRAVELLED</span><span id="fl"></span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </div>
</div>
<footer class="site-footer">© <span id="copyright-year"></span> Karim Kecir</footer>
</body>
</html>
